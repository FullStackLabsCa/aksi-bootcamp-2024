server:
  port: 8080

spring:
  application:
    name: ems
    otp:
      timeout-min: 2
      failure:
        max-count: 3
        block-timeout-hr: 2
      generation:
        max-count: 5
        block-timeout-hr: 8
  datasource:
    url: jdbc:postgresql://localhost:5432/ems_app
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  activemq:
    broker-url: tcp://localhost:61616
  jms:
    template:
      default-destination: myDefaultQueue