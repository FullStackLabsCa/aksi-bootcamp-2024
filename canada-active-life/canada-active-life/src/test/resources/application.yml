spring:
  datasource:
    url: jdbc:h2:mem:testdb  # For H2 in-memory database (replace with your database URL)
    username: sa             # Database username (replace as needed)
    password: password       # Database password (replace as needed)
    driver-class-name: org.h2.Driver # Change for other databases like MySQL or PostgreSQL
  jpa:
    hibernate:
      ddl-auto: create-drop  # Options: 'none', 'update', 'create', 'create-drop'
      show-sql: true    # Optional: Enable SQL logging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect  # Change dialect for MySQL or PostgreSQL
        format_sql: true   # Pretty print the SQL in the logs
        hbm2ddl.auto: create-drop  # Automatic schema update behavior