spring:
  datasource:
    url: jdbc:h2:mem:testdb  # In-memory H2 database (for testing or dev)
    username: sa              # Default username for H2
    password: password        # Default password for H2
    driver-class-name: org.h2.Driver
    jpa:
      hibernate:
        ddl-auto: create-drop     # Automatically update the database schema on startup
      show-sql: true          # Optionally, log SQL queries
